name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.10.11"
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile
      - run: uv sync --directory apps/api --frozen --extra dev
      - run: pnpm exec supabase start
      - run: pnpm exec supabase db reset
      - run: python3 scripts/local.py ci-env
      - run: docker compose up --build --wait
      - run: pnpm test:api --cov=app --cov-report=xml:coverage-unit.xml
      - run: pnpm lint:api
      - run: pnpm test:api:integration --cov=app --cov-report=xml:coverage-integration.xml
      - run: pnpm test:web --coverage
      - run: pnpm lint:web
      - run: pnpm --dir apps/web build
      - run: pnpm --dir apps/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-reports
          path: |
            apps/api/coverage-*.xml
            apps/web/coverage/
            apps/web/test-results/
      - run: docker compose down
        if: always()
