[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "saas-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "pydantic-settings>=2.6,<3.0",
  "supabase>=2.10,<3.0",
  "redis>=5.2,<7.0",
  "prometheus-client>=0.21,<1.0",
  "sentry-sdk>=2.19,<3.0",
  "uvicorn[standard]>=0.32,<1.0"
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1.0",
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.24,<1.0",
  "pytest-cov>=6,<8",
  "psycopg[binary]>=3.2,<4",
  "ruff>=0.8,<1.0"
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = ["B008"]
